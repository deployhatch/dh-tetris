<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stackline Tetris</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eef3f2;
      --muted: #8e9b9c;
      --panel: #142022;
      --line: #294042;
      --accent: #ffcb68;
      --cyan: #6fe7e2;
      --coral: #ff806b;
      --cell: min(7.5vw, 32px);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: radial-gradient(circle at 50% -10%, #28494a 0, #112021 45%, #0c1516 100%);
    }

    main { width: min(100%, 650px); }
    header { display: flex; justify-content: space-between; align-items: end; margin-bottom: 18px; }
    .kicker { margin: 0 0 6px; color: var(--accent); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.6rem); letter-spacing: -0.06em; line-height: 0.9; }
    .status { color: var(--muted); font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; }
    .layout { display: grid; grid-template-columns: 1fr 150px; gap: 16px; align-items: start; }
    .board-wrap { position: relative; padding: 12px; border: 1px solid var(--line); background: #0a1213; box-shadow: 0 18px 50px #06101188; }
    canvas { display: block; width: calc(var(--cell) * 10); height: calc(var(--cell) * 20); max-width: 100%; margin: auto; background: #0c1718; image-rendering: pixelated; }
    .overlay { position: absolute; inset: 12px; display: grid; place-items: center; padding: 20px; text-align: center; background: #0a1213cc; }
    .overlay[hidden] { display: none; }
    .overlay strong { display: block; margin-bottom: 6px; color: var(--accent); font-size: 1.35rem; }
    .overlay span { color: var(--muted); font-size: 0.85rem; }
    .side { display: grid; gap: 10px; }
    .panel { padding: 14px; border: 1px solid var(--line); background: #142022dd; }
    .panel-label { color: var(--muted); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .score { margin-top: 3px; color: var(--accent); font-size: 1.75rem; font-weight: 700; }
    .mini { display: block; width: 100px; height: 76px; margin: 12px auto 0; image-rendering: pixelated; }
    button { border: 1px solid var(--line); color: var(--ink); background: #1c2d2f; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { border-color: var(--cyan); background: #263d3f; }
    .action { width: 100%; padding: 10px; }
    .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
    .controls button { min-height: 42px; font-size: 1.05rem; }
    .controls .wide { grid-column: span 3; }
    .hint { margin: 14px 0 0; color: var(--muted); font-size: 0.75rem; line-height: 1.5; }
    @media (max-width: 540px) {
      body { padding: 16px; }
      header { align-items: start; }
      .status { display: none; }
      .layout { grid-template-columns: 1fr 112px; gap: 10px; }
      .panel { padding: 10px; }
      .score { font-size: 1.35rem; }
      .hint { display: none; }
      .mini { width: 82px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="kicker">Arcade / 01</p><h1>Stackline</h1></div>
      <div class="status">Clear the board</div>
    </header>
    <section class="layout" aria-label="Tetris game">
      <div>
        <div class="board-wrap">
          <canvas id="board" width="320" height="640" aria-label="Tetris board"></canvas>
          <div class="overlay" id="overlay"><div><strong>Ready?</strong><span>Press a key or tap a control</span></div></div>
        </div>
        <div class="controls" aria-label="Touch controls">
          <button data-action="left" aria-label="Move left">&#8592;</button>
          <button data-action="rotate" aria-label="Rotate">&#8635;</button>
          <button data-action="right" aria-label="Move right">&#8594;</button>
          <button class="wide" data-action="drop">Drop</button>
        </div>
      </div>
      <aside class="side">
        <div class="panel"><div class="panel-label">Score</div><div class="score" id="score">000000</div></div>
        <div class="panel"><div class="panel-label">Lines</div><div class="score" id="lines">0</div></div>
        <div class="panel"><div class="panel-label">Next</div><canvas class="mini" id="next" width="100" height="76"></canvas></div>
        <button class="action" id="pause">Pause</button>
        <button class="action" id="restart">Restart</button>
        <p class="hint">Arrows move<br>Up rotates<br>Space drops<br>P pauses</p>
      </aside>
    </section>
  </main>
  <script>
    const boardCanvas = document.getElementById('board');
    const nextCanvas = document.getElementById('next');
    const boardContext = boardCanvas.getContext('2d');
    const nextContext = nextCanvas.getContext('2d');
    const columns = 10;
    const rows = 20;
    const cellSize = 32;
    const colors = [null, '#6fe7e2', '#ff806b', '#ffcb68', '#b5e66b', '#bc9cff', '#f48fc0', '#79a9ff'];
    const pieces = [
      [[1, 1, 1, 1]], [[2, 0, 0], [2, 2, 2]], [[0, 0, 3], [3, 3, 3]],
      [[4, 4], [4, 4]], [[0, 5, 5], [5, 5, 0]], [[0, 6, 0], [6, 6, 6]], [[7, 7, 0], [0, 7, 7]]
    ];
    let arena;
    let player;
    let nextPiece;
    let score = 0;
    let lines = 0;
    let lastTime = 0;
    let dropCounter = 0;
    let dropInterval = 750;
    let running = false;
    let paused = false;

    function createArena() { return Array.from({ length: rows }, () => Array(columns).fill(0)); }
    function randomPiece() { return pieces[Math.floor(Math.random() * pieces.length)].map(row => row.slice()); }
    function resetPlayer() {
      player.matrix = nextPiece || randomPiece();
      nextPiece = randomPiece();
      player.pos.y = 0;
      player.pos.x = Math.floor(columns / 2) - Math.ceil(player.matrix[0].length / 2);
      drawNext();
      if (collides()) endGame();
    }
    function collides() {
      for (let y = 0; y < player.matrix.length; y++) for (let x = 0; x < player.matrix[y].length; x++) {
        if (player.matrix[y][x] && (arena[player.pos.y + y]?.[player.pos.x + x] !== 0)) return true;
      }
      return false;
    }
    function merge() { player.matrix.forEach((row, y) => row.forEach((value, x) => { if (value) arena[player.pos.y + y][player.pos.x + x] = value; })); }
    function sweep() {
      let cleared = 0;
      outer: for (let y = rows - 1; y >= 0; y--) {
        if (arena[y].every(Boolean)) { arena.splice(y, 1); arena.unshift(Array(columns).fill(0)); cleared++; y++; }
      }
      if (cleared) { lines += cleared; score += [0, 100, 300, 500, 800][cleared] * Math.max(1, Math.floor(lines / 10)); dropInterval = Math.max(120, 750 - Math.floor(lines / 10) * 60); updateStats(); }
    }
    function drop() { player.pos.y++; if (collides()) { player.pos.y--; merge(); sweep(); resetPlayer(); } dropCounter = 0; }
    function move(direction) { if (!running || paused) return; player.pos.x += direction; if (collides()) player.pos.x -= direction; }
    function rotate() {
      if (!running || paused) return;
      const matrix = player.matrix;
      for (let y = 0; y < matrix.length; y++) for (let x = 0; x < y; x++) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
      matrix.forEach(row => row.reverse());
      if (collides()) { matrix.forEach(row => row.reverse()); for (let y = 0; y < matrix.length; y++) for (let x = 0; x < y; x++) [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]]; }
    }
    function hardDrop() { if (!running || paused) return; while (!collides()) player.pos.y++; player.pos.y--; drop(); score += 2; updateStats(); }
    function drawMatrix(context, matrix, offset, size) { matrix.forEach((row, y) => row.forEach((value, x) => { if (!value) return; context.fillStyle = colors[value]; context.fillRect((x + offset.x) * size + 1, (y + offset.y) * size + 1, size - 2, size - 2); })); }
    function draw() { boardContext.fillStyle = '#0c1718'; boardContext.fillRect(0, 0, boardCanvas.width, boardCanvas.height); boardContext.strokeStyle = '#172829'; for (let x = 0; x <= columns; x++) { boardContext.beginPath(); boardContext.moveTo(x * cellSize, 0); boardContext.lineTo(x * cellSize, boardCanvas.height); boardContext.stroke(); } for (let y = 0; y <= rows; y++) { boardContext.beginPath(); boardContext.moveTo(0, y * cellSize); boardContext.lineTo(boardCanvas.width, y * cellSize); boardContext.stroke(); } drawMatrix(boardContext, arena, { x: 0, y: 0 }, cellSize); if (player) drawMatrix(boardContext, player.matrix, player.pos, cellSize); }
    function drawNext() { nextContext.fillStyle = '#142022'; nextContext.fillRect(0, 0, nextCanvas.width, nextCanvas.height); const offset = { x: Math.floor((3 - nextPiece[0].length) / 2), y: Math.floor((2 - nextPiece.length) / 2) }; drawMatrix(nextContext, nextPiece, offset, 25); }
    function updateStats() { document.getElementById('score').textContent = String(score).padStart(6, '0'); document.getElementById('lines').textContent = lines; }
    function setOverlay(title, message, visible = true) { const overlay = document.getElementById('overlay'); overlay.hidden = !visible; overlay.querySelector('strong').textContent = title; overlay.querySelector('span').textContent = message; }
    function startGame() { arena = createArena(); player = { pos: { x: 0, y: 0 }, matrix: null }; nextPiece = null; score = 0; lines = 0; dropInterval = 750; paused = false; running = true; document.getElementById('pause').textContent = 'Pause'; updateStats(); resetPlayer(); setOverlay('', '', false); }
    function endGame() { running = false; setOverlay('Game over', 'Press Restart to play again'); }
    function togglePause() { if (!running) return; paused = !paused; document.getElementById('pause').textContent = paused ? 'Resume' : 'Pause'; setOverlay(paused ? 'Paused' : '', paused ? 'Take a breath' : '', paused); }
    function loop(time = 0) { const delta = time - lastTime; lastTime = time; if (running && !paused) { dropCounter += delta; if (dropCounter > dropInterval) drop(); draw(); } else draw(); requestAnimationFrame(loop); }
    document.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') move(-1); else if (event.key === 'ArrowRight') move(1); else if (event.key === 'ArrowDown') drop(); else if (event.key === 'ArrowUp') rotate(); else if (event.code === 'Space') { event.preventDefault(); hardDrop(); } else if (event.key.toLowerCase() === 'p') togglePause(); });
    document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => ({ left: () => move(-1), right: () => move(1), rotate, drop: hardDrop }[button.dataset.action])()));
    document.getElementById('pause').addEventListener('click', togglePause);
    document.getElementById('restart').addEventListener('click', startGame);
    startGame(); requestAnimationFrame(loop);
  </script>
</body>
</html>
